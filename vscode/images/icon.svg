<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>ViewSense for CodeIgniter</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F26B3A"/>
      <stop offset="1" stop-color="#C2321A"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2418"/>
      <stop offset="1" stop-color="#2A120B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="26" fill="url(#background)"/>

  <!-- The eye: "View" -->
  <path d="M14 64 C34 30 94 30 114 64 C94 98 34 98 14 64 Z" fill="#FFFFFF"/>

  <!-- The iris -->
  <circle cx="64" cy="64" r="25" fill="url(#iris)"/>

  <!-- The PHP variable sign "$", drawn as strokes so no font is needed -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 45 V83" stroke-width="4"/>
    <path d="M73.5 54.5 C71 49.5 58 48.5 56 55.5 C54 62.5 73 61.5 73 70.5 C73 78.5 58 79.5 54.5 73.5" stroke-width="5.5"/>
  </g>

  <!-- Light reflection on the iris -->
  <circle cx="75" cy="52" r="4" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
