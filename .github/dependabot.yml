# Weekly pull requests to keep dependencies and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
    groups:
      # One pull request for all development tools instead of one per package.
      development:
        dependency-type: development
    ignore:
      # typescript-eslint only supports TypeScript below 6.1 for now. Remove this rule when its
      # peer dependency accepts newer versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @types/vscode must match the oldest supported VS Code (engines.vscode in package.json),
      # or vsce refuses to package the extension. Raise both together, on purpose.
      - dependency-name: "@types/vscode"
        versions: [">=1.102.0"]
      # @types/node must not get ahead of the Node.js that runs the extension inside VS Code,
      # or TypeScript would accept functions that don't exist there. VS Code 1.101 runs
      # Node 22, and Vitest needs 22 or later.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
