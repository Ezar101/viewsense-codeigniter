<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>ViewSense for CodeIgniter</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F26B3A"/>
      <stop offset="1" stop-color="#C2321A"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2418"/>
      <stop offset="1" stop-color="#2A120B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="26" fill="url(#background)"/>

  <!-- Code brackets "< >": a view template -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 44 L11 64 L27 84"/>
    <path d="M101 44 L117 64 L101 84"/>
  </g>

  <!-- The eye: "View" -->
  <path d="M34 64 C46 41 82 41 94 64 C82 87 46 87 34 64 Z" fill="#FFFFFF"/>

  <!-- The iris, with a light reflection -->
  <circle cx="64" cy="64" r="14" fill="url(#iris)"/>
  <circle cx="69.5" cy="58.5" r="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
